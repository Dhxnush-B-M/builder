<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>rbuilder — Professional Resume Builder</title>
    <script type="text/javascript">
      // SPA 404 fallback redirection script for static hostings
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + (l.pathname.slice(0, l.pathname.indexOf('/', 1) + 1) || '/') + '?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
