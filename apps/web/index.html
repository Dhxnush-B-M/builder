<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#09090B" />
		<meta name="application-name" content="rbuilder" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="rbuilder" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="description" content="rbuilder is a free and modern resume builder that simplifies creating and customizing professional resumes.">

		<meta property="og:title" content="rbuilder — Professional Resume Builder" />
		<meta property="og:description" content="rbuilder is a free and modern resume builder that simplifies creating and customizing professional resumes." />
		<meta property="og:image" content="https://rbuilder.space/opengraph/banner.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:type" content="website" />
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:title" content="rbuilder — Professional Resume Builder" />
		<meta property="twitter:description" content="rbuilder is a free and modern resume builder that simplifies creating and customizing professional resumes." />
		<meta property="twitter:image" content="https://rbuilder.space/opengraph/banner.jpg" />

		<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="128x128" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="256x256 any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" type="image/png" sizes="180x180 any" />
		<title>rbuilder — Professional Resume Builder</title>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.getRegistrations().then((registrations) => {
					for(const registration of registrations) {
						registration.unregister();
					}
				});
			}
			if ('caches' in window) {
				caches.keys().then((names) => {
					for (const name of names) caches.delete(name);
				});
			}
		</script>
	</head>
	<body>
		<!-- Keep #app empty: main.tsx only mounts React when rootElement has no children. -->
		<div id="app"></div>
		<!-- Branded first paint with new green rb logo; hidden once React populates #app -->
		<div id="initial-loader">
			<img src="/opengraph/logo.png" width="80" height="80" alt="rbuilder" style="border-radius: 18px; background: #000; box-shadow: 0 0 24px rgba(16, 185, 129, 0.5); border: 1px solid rgba(16, 185, 129, 0.3);" />
			<div class="initial-loader__brand">rbuilder</div>
		</div>
		<style>
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				background: #09090b;
				z-index: 9999;
			}
			#app:not(:empty) ~ #initial-loader { display: none; }
			.initial-loader__brand {
				font-family: system-ui, -apple-system, sans-serif;
				font-size: 24px;
				font-weight: 800;
				background: linear-gradient(to right, #34d399, #10b981, #14b8a6);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				letter-spacing: -0.5px;
			}
		</style>
		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
